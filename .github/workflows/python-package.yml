# Create and test Python package on multiple versions — GitHub suggested workflow
# Author: Nitesh Kumar Singh (nkscoder)

name: Python package

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint package metadata
        run: python -m pip install build && python -m build

      - name: Test with Django
        run: |
          python ci/manage.py migrate --run-syncdb
          python ci/manage.py test feedback.tests
