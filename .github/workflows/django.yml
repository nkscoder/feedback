# Build and test Django app — suggested workflow for nkscoder-django-feedback
# Author: Nitesh Kumar Singh (nkscoder) — https://github.com/nkscoder/feedback

name: Django CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run migrations
        run: python ci/manage.py migrate --run-syncdb

      - name: Run Django tests
        run: python ci/manage.py test feedback.tests --verbosity=2

      - name: Verify package builds
        run: python -m build
