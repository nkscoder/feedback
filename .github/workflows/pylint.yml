# Lint Python code with Pylint — GitHub suggested workflow
# Author: Nitesh Kumar Singh (nkscoder)

name: Pylint

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pylint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pylint
        run: |
          python -m pip install --upgrade pip
          pip install pylint pylint-django
          pip install -e .

      - name: Run Pylint
        run: |
          pylint models.py views.py services.py analytics.py admin.py apps.py \
            conf.py context_processors.py dashboard_views.py forms.py urls.py tests.py \
            --load-plugins=pylint_django \
            --django-settings-module=ci.settings \
            --disable=C0114,C0115,C0116,R0903,W0511 \
            --max-line-length=120
