<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Feedback{% endblock %} — {{ feedback_seo_site_name|default:"nkscoder" }}</title>
  {% include "feedback/_seo_head.html" %}
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  {% block extra_head %}{% endblock %}
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-dark mb-0">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1">{% block nav_title %}Feedback{% endblock %}</span>
      <div class="d-flex gap-2 small">
        <a class="nav-link text-white-50 py-0" href="{% url 'feedback:ai_dashboard' %}">Dashboard</a>
        <a class="nav-link text-white-50 py-0" href="{% url 'feedback:license' %}">License</a>
        <a class="nav-link text-white-50 py-0" href="{{ feedback_homepage_url|default:'https://nkscoder.in' }}" rel="noopener noreferrer">nkscoder.in</a>
      </div>
    </div>
  </nav>
  {% block content %}{% endblock %}
  {% include "feedback/_opensource_footer.html" %}
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
